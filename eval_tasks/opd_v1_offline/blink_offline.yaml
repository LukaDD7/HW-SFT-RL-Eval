dataset_path: parquet
dataset_kwargs:
  data_files:
    test: assets/datasets/BLINK/*/val-*.parquet
task: blink_offline
test_split: test
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.blink.utils.blink_doc_to_visual
doc_to_text: !function lmms_eval.tasks.blink.utils.blink_doc_to_text
doc_to_target: answer
process_results: !function lmms_eval.tasks.blink.utils.blink_process_results
metric_list:
  - metric: blink_acc
    aggregation: !function lmms_eval.tasks.blink.utils.blink_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: "Note: You only need to respond with {} without providing any additional information.\n"
    post_prompt: ""
generation_kwargs:
  max_new_tokens: 1024
