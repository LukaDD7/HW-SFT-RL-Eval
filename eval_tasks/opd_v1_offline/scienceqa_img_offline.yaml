dataset_path: parquet
dataset_kwargs:
  data_files:
    test: assets/datasets/ScienceQA-IMG/data/test-*.parquet
task: scienceqa_img_offline
test_split: test
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.scienceqa.utils.sqa_doc_to_visual
doc_to_text: !function lmms_eval.tasks.scienceqa.utils.sqa_doc_to_text
doc_to_target: !function lmms_eval.tasks.scienceqa.utils.sqa_doc_to_target
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
process_results: !function lmms_eval.tasks.scienceqa.utils.sqa_process_results
lmms_eval_specific_kwargs:
  default:
    format: default
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
  qwen_vl:
    format: qwen_vl
  idefics2:
    format: default
    pre_prompt: ""
    post_prompt: "\nAnswer:"
