dataset_path: parquet
dataset_kwargs:
  data_files:
    validation: assets/datasets/VQAv2/data/validation-*.parquet
task: vqav2_val_offline
test_split: validation
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.vqav2.utils.vqav2_doc_to_visual
doc_to_text: !function lmms_eval.tasks.vqav2.utils.vqav2_doc_to_text
doc_to_target: answer
generation_kwargs:
  max_new_tokens: 16
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
process_results: !function lmms_eval.tasks.vqav2.utils.vqav2_process_results_val
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
  plm:
    pre_prompt: ""
    post_prompt: ""
