dataset_path: parquet
dataset_kwargs:
  data_files:
    test: assets/datasets/MMSI-Bench/MMSI_Bench.parquet
task: mmsi_bench_offline
test_split: test
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.mmsi_bench.utils.msr_doc_to_visual
doc_to_text: !function lmms_eval.tasks.mmsi_bench.utils.msr_doc_to_text
doc_to_target: answer
process_results: !function lmms_eval.tasks.mmsi_bench.utils.msr_process_results
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly. Enclose the option's letter within ``."
generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  do_sample: false
metric_list:
  - metric: Positional Relationship (Obj.–Obj.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Positional Relationship (Cam.–Obj.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Positional Relationship (Cam.–Cam.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Positional Relationship (Obj.–Reg.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Positional Relationship (Cam.–Reg.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Positional Relationship (Reg.–Reg.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Attribute (Meas.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Attribute (Appr.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Motion (Obj.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: Motion (Cam.)
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: MSR
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
  - metric: average
    aggregation: !function lmms_eval.tasks.mmsi_bench.utils.msr_aggregate_results
    higher_is_better: true
