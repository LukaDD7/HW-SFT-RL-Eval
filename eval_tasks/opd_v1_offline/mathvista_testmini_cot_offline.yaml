dataset_path: parquet
dataset_kwargs:
  data_files:
    testmini: assets/datasets/MathVista/data/testmini-*.parquet
task: mathvista_testmini_cot_offline
test_split: testmini
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.mathvista.utils.mathvista_doc_to_visual
doc_to_text: !function lmms_eval.tasks.mathvista.utils.mathvista_doc_to_text
doc_to_target: answer
generation_kwargs:
  max_new_tokens: 16384
process_results: !function lmms_eval.tasks.mathvista.utils.mathvista_process_results
metric_list:
  - metric: llm_as_judge_eval
    aggregation: !function lmms_eval.tasks.mathvista.utils.mathvista_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    shot_type: step-by-step
    shot: 0
    use_caption: false
    use_ocr: false
