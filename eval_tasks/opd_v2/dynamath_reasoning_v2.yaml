task: dynamath_reasoning_v2
tag:
  - opd_v2
dataset_path: kcz358/DynaMath
output_type: generate_until
doc_to_target: "ground_truth"
metric_list:
  - metric: dynamath_average
    aggregation: !function dynamath_reasoning_v2.dynamath_v2_aggregate_results_average
    higher_is_better: true
  - metric: dynamath_worst
    aggregation: !function dynamath_reasoning_v2.dynamath_v2_aggregate_results_worst
    higher_is_better: true

# Shared output budget for all prompt modes. The repository OpenAI adapter
# preserves this budget after the pinned backend's historical 4096-token clamp.
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0
  do_sample: false

test_split: test
doc_to_messages: !function dynamath_reasoning_v2.dynamath_v2_doc_to_messages
doc_to_text: !function dynamath_reasoning_v2.dynamath_v2_doc_to_text
doc_to_visual: !function dynamath_reasoning_v2.dynamath_v2_doc_to_visual
process_results: !function dynamath_reasoning_v2.dynamath_v2_process_results
