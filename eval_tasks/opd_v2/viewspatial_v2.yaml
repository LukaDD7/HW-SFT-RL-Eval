dataset_path: oscarqjh/ViewSpatial_lmmseval
dataset_name: default
test_split: test
task: "viewspatial_v2"
tag:
  - opd_v2

generation_kwargs:
  max_new_tokens: 4096
  temperature: 0
  do_sample: false

output_type: generate_until
doc_to_visual: !function viewspatial_v2.viewspatial_v2_doc_to_visual
doc_to_text: !function viewspatial_v2.viewspatial_v2_doc_to_text
doc_to_target: "answer"
process_results: !function viewspatial_v2.viewspatial_v2_process_results

metric_list:
  - metric: overall_accuracy
    aggregation: !function viewspatial_v2.viewspatial_v2_aggregate_results
    higher_is_better: true
