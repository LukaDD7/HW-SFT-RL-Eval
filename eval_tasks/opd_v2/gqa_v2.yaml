dataset_path: lmms-lab/GQA
dataset_name: testdev_balanced_instructions
dataset_kwargs:
  token: True
task: "gqa_v2"
tag:
  - opd_v2
test_split: testdev
output_type: generate_until
doc_to_visual: !function gqa_v2.gqa_v2_doc_to_visual
doc_to_text: !function gqa_v2.gqa_v2_doc_to_text
doc_to_target: "answer"
process_docs: !function gqa_v2.gqa_v2_process_docs
process_results: !function gqa_v2.gqa_v2_process_results
generation_kwargs:
  max_new_tokens: 4096
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  - version: 2.0

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
  qwen_vl:
    pre_prompt: ""
    post_prompt: " Answer:"
